[package]
name = "pinnos-face"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
pinnos-protocol.workspace = true
pinnos-theme.workspace = true
winit = "0.30.13"
wgpu = { version = "30.0.1", default-features = false, features = ["dx12", "vulkan", "wgsl"] }
glyphon = "0.12.0"
pollster = "1.0.1"
bytemuck = { version = "1.25.2", features = ["derive"] }
png = "0.18.1"
log = { version = "0.4.34", features = ["std"] }
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
# Display timing probes for examples/present_probe.rs.
windows-sys = { version = "0.61.2", features = ["Wdk_Graphics_Direct3D", "Win32_Graphics_Dwm"] }
