[workspace]
resolver = "2"
members = ["crates/erebus-theme", "crates/erebus-protocol", "crates/erebus-core", "crates/erebus-face"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
erebus-theme = { path = "crates/erebus-theme" }
erebus-protocol = { path = "crates/erebus-protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
