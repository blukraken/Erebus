[workspace]
resolver = "2"
members = ["crates/pinnos-theme", "crates/pinnos-protocol", "crates/pinnos-core", "crates/pinnos-face"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
pinnos-theme = { path = "crates/pinnos-theme" }
pinnos-protocol = { path = "crates/pinnos-protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
